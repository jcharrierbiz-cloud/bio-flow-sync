<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bio-Flow — hors ligne</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center;
        justify-content: center; background: #f1e8d8; color: #1a1a1a;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px;
      }
      @media (prefers-color-scheme: dark) { body { background: #1c1a17; color: #eee6da; } }
      .card { max-width: 22rem; text-align: center; }
      h1 { font-size: 1.15rem; margin: 0 0 .5rem; }
      p { font-size: .9rem; line-height: 1.5; opacity: .75; margin: 0 0 1.25rem; }
      button {
        border: 0; border-radius: .75rem; padding: .7rem 1.4rem; cursor: pointer;
        background: #7c9a6a; color: #fff; font-size: .85rem; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Pas de connexion</h1>
      <p>Bio-Flow a besoin du réseau pour charger tes données. Tes rappels, eux, continuent d'arriver.</p>
      <button onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
