<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{color-scheme:light dark;--bg:#f6f4ec;--ink:#1d2a23;--mute:#5d6f64;--line:#d9d5c6;--acc:#9a7a2c;--panel:#fffdf6}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1814;--ink:#ebe9dd;--mute:#8ea396;--line:#31503f;--acc:#d7b56d;--panel:#18261f}}
  body{background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:720px;margin:0 auto;padding:24px 16px 64px}
  h1{font-size:30px;line-height:1.2;margin:8px 0 12px} h2{font-size:22px;margin:40px 0 10px;padding-top:16px;border-top:1px solid var(--line)} h3{font-size:17px;margin:24px 0 6px}
  a{color:var(--acc)} hr{display:none} code{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:.92em}
  table{border-collapse:collapse;width:100%;font-size:15px} th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
  blockquote{margin:12px 0;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:6px}
  blockquote p{margin:0} li{margin:4px 0} p,li{max-width:68ch} header#title-block-header{display:none}
</style>
